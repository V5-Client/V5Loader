name: Build Linux Native Pathfinder JNI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-builder:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
            java_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            java_arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
          architecture: ${{ matrix.java_arch }}

      - name: Build native library
        run: |
          cmake -S NativeSrc -B NativeSrc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build NativeSrc/build --config Release -j

      - name: Stage artifact
        run: |
          mkdir -p "artifact/linux/${{ matrix.arch }}"
          cp NativeSrc/build/V5PathJNI.so "artifact/linux/${{ matrix.arch }}/V5PathJNI.so"

      - name: Upload Linux native
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux-${{ matrix.arch }}
          path: artifact/linux/${{ matrix.arch }}/V5PathJNI.so
          if-no-files-found: error
