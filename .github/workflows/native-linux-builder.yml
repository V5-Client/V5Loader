name: Build Linux Native Pathfinder JNI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux-builder:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build native library
        run: |
          cmake -S NativeSrc -B NativeSrc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build NativeSrc/build --config Release -j

      - name: Stage artifact
        run: |
          mkdir -p artifact/linux/x86_64
          cp NativeSrc/build/V5PathJNI.so artifact/linux/x86_64/V5PathJNI.so

      - name: Upload Linux native
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: artifact/linux/x86_64/V5PathJNI.so
          if-no-files-found: error
