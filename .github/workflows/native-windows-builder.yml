name: Build Windows Native Pathfinder JNI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-builder:
    runs-on: blacksmith-2vcpu-windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S NativeSrc -B NativeSrc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build NativeSrc/build --config Release --parallel

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/windows/x86_64 | Out-Null
          if (Test-Path "NativeSrc/build/Release/V5PathJNI.dll") {
            Copy-Item NativeSrc/build/Release/V5PathJNI.dll artifact/windows/x86_64/V5PathJNI.dll -Force
          } else {
            Copy-Item NativeSrc/build/V5PathJNI.dll artifact/windows/x86_64/V5PathJNI.dll -Force
          }

      - name: Upload Windows native
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-windows-x86_64
          path: artifact/windows/x86_64/V5PathJNI.dll
          if-no-files-found: error
