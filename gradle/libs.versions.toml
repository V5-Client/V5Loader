[versions]
# Library versions
minecraft = "26.2"
lwjgl = "3.4.1"

loader = "0.19.3"
fabric-api = "0.156.0+26.2"
fabric-kotlin = "1.13.9+kotlin.2.3.10"
sponge-mixin = "0.17.3+mixin.0.8.7"
mixinextras = "0.5.4"

rhino = "7c7c509668"
koffee = "315bc11234"

universalcraft = "511"
elementa = "745"
vigilance = "314"
hypixel-mod-api = "1.0.2"
hypixel-modrinth-api = "1.0.2+build.1+mc26.1"

# Plugin Versions
kotlin = "2.3.10"
loom = "1.17-SNAPSHOT"
ksp = "2.3.9"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin" }
sponge-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "sponge-mixin" }
mixinextras = { module = "io.github.llamalad7:mixinextras-fabric", version.ref = "mixinextras" }

lwjgl-nanovg = { module = "org.lwjgl:lwjgl-nanovg", version.ref = "lwjgl" }

rhino = { module = "com.github.ChatTriggers:rhino", version.ref = "rhino" }
koffee = { module = "com.github.ChatTriggers:koffee", version.ref = "koffee" }

universalcraft = { module = "gg.essential:universalcraft-26.2-fabric", version.ref = "universalcraft" }
elementa = { module = "gg.essential:elementa", version.ref = "elementa" }
vigilance = { module = "gg.essential:vigilance", version.ref = "vigilance" }
hypixel-mod-api = { module = "net.hypixel:mod-api", version.ref = "hypixel-mod-api" }
hypixel-modrinth-api = { module = "maven.modrinth:hypixel-mod-api", version.ref = "hypixel-modrinth-api" }

ksp = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[bundles]
included = ["rhino", "koffee"]
[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
